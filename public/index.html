<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>North Woods Menu</title>
    <style>
      :root {
        --bg: #f3f2ee;
        --paper: #ffffff;
        --ink: #1f1f1f;
        --muted: #5a5a5a;
        --line: #dfe3dd;
        --accent: #123d63;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        min-height: 100vh;
      }
      .page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px 18px 36px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(1.8rem, 2.4vw, 2.6rem);
      }
      .layout {
        display: grid;
        grid-template-columns: repeat(5, minmax(120px, 1fr));
        gap: 10px;
        align-items: stretch;
      }
      .calendar-header {
        display: contents;
      }
      .weekday {
        padding: 8px 6px;
        text-align: center;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
      }
      .panel {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 10px 10px;
        min-height: 180px;
      }
      .panel.empty-cell {
        background: rgba(255, 255, 255, 0.35);
        border-style: dashed;
        border-color: var(--line);
      }
      .meal {
        margin: 0 0 8px;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .day {
        border-top: 1px solid var(--line);
        padding-top: 8px;
        margin-top: 8px;
      }
      .day:first-of-type {
        border-top: none;
        margin-top: 0;
        padding-top: 0;
      }
      .day h3 {
        margin: 0 0 8px;
        font-size: 0.82rem;
        font-weight: 700;
      }
      .section {
        margin-bottom: 10px;
      }
      .section h4 {
        margin: 0 0 6px;
        font-size: 0.68rem;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .section ul {
        margin: 0;
        padding-left: 1.1rem;
      }
      .section li {
        margin: 0 0 4px;
        line-height: 1.25;
        font-size: 0.8rem;
      }
      .empty {
        color: var(--muted);
        font-style: italic;
      }
      .calendar-week {
        display: contents;
      }

      @media (max-width: 860px) {
        .layout {
          display: block;
        }
        .calendar-header {
          display: none;
        }
        .calendar-week {
          display: block;
        }
        .panel {
          min-height: auto;
          margin-bottom: 12px;
        }
        .panel.empty-cell {
          display: none;
        }
      }

      @media print {
        html, body {
          background: #fff;
        }
        .page {
          max-width: none;
          padding: 0;
        }
        .layout {
          display: grid !important;
          grid-template-columns: repeat(5, minmax(120px, 1fr));
          gap: 6px;
          align-items: stretch;
        }
        .calendar-header {
          display: contents;
        }
        .calendar-week {
          display: contents;
        }
        .panel {
          break-inside: avoid;
          box-shadow: none;
          border-color: #999;
          min-height: 0;
          padding: 8px 6px 6px;
          margin: 0;
        }
        .panel.empty-cell {
          display: block;
          background: rgba(0, 0, 0, 0.02);
          border-style: solid;
          opacity: 0.5;
        }
        .meal {
          margin-bottom: 6px;
          font-size: 0.6rem;
        }
        .section {
          margin-bottom: 6px;
        }
        .section h4 {
          font-size: 0.58rem;
        }
        .section li {
          font-size: 0.66rem;
          line-height: 1.2;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <h1>North Woods Menu</h1>
      <div id="menu" class="layout"></div>
    </main>

    <script>
      async function loadMenu() {
        const menuEl = document.getElementById('menu');

        try {
          const response = await fetch('/api/menu');
          const payload = await response.json();

          if (!response.ok) {
            throw new Error(payload.message || 'Unable to load menu');
          }

          const meals = payload.meals || [];
          if (!meals.length) {
            menuEl.innerHTML = '<div class="empty">No menu data available.</div>';
            return;
          }

          const dayMap = new Map();

          for (const meal of meals) {
            for (const day of meal.days || []) {
              const iso = new Date(day.date).toISOString().slice(0, 10);
              if (!dayMap.has(iso)) {
                dayMap.set(iso, { date: day.date, meals: [] });
              }
              dayMap.get(iso).meals.push({
                label: meal.label,
                sections: day.sections || []
              });
            }
          }

          const orderedDays = [...dayMap.values()].sort((a, b) => new Date(a.date) - new Date(b.date));
          const firstDate = orderedDays.length ? new Date(orderedDays[0].date) : new Date();
          const lastDate = orderedDays.length ? new Date(orderedDays[orderedDays.length - 1].date) : new Date();

          const thisMonday = new Date();
          const mondayOffset = (thisMonday.getDay() + 6) % 7;
          thisMonday.setDate(thisMonday.getDate() - mondayOffset);
          thisMonday.setHours(0, 0, 0, 0);

          const gridStart = new Date(thisMonday);
          const gridEnd = new Date(lastDate);
          const lastWeekdayOffset = (7 - ((gridEnd.getDay() + 6) % 7 + 1)) % 7;
          gridEnd.setDate(gridEnd.getDate() + lastWeekdayOffset);

          const totalDays = Math.round((gridEnd - gridStart) / 86400000) + 1;
          const calendarDays = [];

          for (let index = 0; index < totalDays; index += 1) {
            const currentDate = new Date(gridStart);
            currentDate.setDate(gridStart.getDate() + index);
            const iso = currentDate.toISOString().slice(0, 10);
            const dayEntry = dayMap.get(iso);
            calendarDays.push({
              date: currentDate,
              entry: dayEntry || null,
              isInRange: !!dayEntry
            });
          }

          const weekdayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
          const headerHtml = weekdayNames.map((name) => `<div class="weekday">${name}</div>`).join('');

          const weeksHtml = [];
          for (let index = 0; index < calendarDays.length; index += 7) {
            const week = calendarDays.slice(index, index + 7).filter((day) => {
              const weekday = day.date.getDay();
              return weekday >= 1 && weekday <= 5;
            });
            const cellsHtml = week.map(({ date, entry, isInRange }) => {
              if (!isInRange) {
                return '<section class="panel empty-cell"><div class="empty">&nbsp;</div></section>';
              }

              const mealBlocks = (entry.meals || []).map((meal) => {
                const sections = (meal.sections || []).map((section) => {
                  const items = (section.items || []).map((item) => `<li>${item}</li>`).join('');
                  return `
                    <div class="section">
                      <h4>${section.title}</h4>
                      <ul>${items}</ul>
                    </div>
                  `;
                }).join('');

                return `
                  <div class="meal-block">
                    <h2 class="meal">${meal.label}</h2>
                    ${sections || '<div class="empty">No items listed.</div>'}
                  </div>
                `;
              }).join('');

              return `
                <section class="panel">
                  <h3>${new Date(date).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}</h3>
                  ${mealBlocks}
                </section>
              `;
            }).join('');

            weeksHtml.push(`<div class="calendar-week">${cellsHtml}</div>`);
          }

          menuEl.innerHTML = `
            <div class="calendar-header">${headerHtml}</div>
            ${weeksHtml.join('')}
          `;
        } catch (error) {
          menuEl.innerHTML = '<div class="empty">Please try again in a few minutes.</div>';
          console.error(error);
        }
      }

      loadMenu();
    </script>
  </body>
</html>
